<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            flex-direction: row;
            justify-content: center;
            background-color: rgb(4, 32, 28);
            flex-wrap: wrap;
            animation: down 1s;
        }
        @keyframes down {
            from{
                transform: translateY(-50%);
                opacity: 0;
            }
            to{
                transform: translateY(0%);
                opacity: 1;
            }
        }
        .proj{
            width: 250px;
            aspect-ratio: 1/1;
            box-shadow: rgba(255, 255, 255, 0.25) 0px 30px 60px -12px, rgba(255, 255, 255, 0.3) 0px 18px 36px -18px; 
            margin: 2%;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            transition: scale 1.5s;
        }
        .proj :hover{
            scale: 1.08;
        }
        .head{
            width: 100%;
            height: 20%;
            border-radius: 20px;
            text-align: center;
            color: white;
            font-family: cursive;
        }
        .primg{
            width: 100%;
            height: 80%;
            border-radius: 20px;
            background-color: greenyellow;
        }
        .primg img{
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }
        @media (width<850px) 
        {
            .proj{
                width: 75vw;
            }
            .head{
                font-size: clamp(1.2rem,2vw,1.8rem);
                align-content: center;
                height: 30%;
            }
            .primg{
                height: 70%;
            }
        }
    </style>
</head>
<body>
    <div class="proj" onclick="loadp('https://github.com/ShivendraSinha418/Amazon_sales_dataAnalysis')">
        <div class="head">Amazon Sales Analysis</div>
        <div class="primg"><img src="https://i.ytimg.com/vi/E-1YOXSUJIk/maxresdefault.jpg" alt=""></div>
    </div>
    <div class="proj" onclick="loadp('https://github.com/ShivendraSinha418/Starbucks-customer-survey-analysis')">
        <div class="head">Starbucks Customer survey Analysis</div>
        <div class="primg"><img src="https://cdn.mos.cms.futurecdn.net/C6Qf6YSUH7nQf2dQPAbzuZ.jpg" alt=""></div>
    </div>
    <script>
        function loadp(url){
            window.open(url, "_blank");
        }
    </script>
</body>
</html>
