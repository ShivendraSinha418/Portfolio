<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            flex-direction: row;
            justify-content: center;
            background-color: rgb(4, 32, 28);
            flex-wrap: wrap;
            animation: down 1s;
        }
        @keyframes down {
            from{
                transform: translateY(-50%);
                opacity: 0;
            }
            to{
                transform: translateY(0%);
                opacity: 1;
            }
        }
        .proj{
            width: 250px;
            aspect-ratio: 1/1;
            box-shadow: rgba(255, 255, 255, 0.25) 0px 30px 60px -12px, rgba(255, 255, 255, 0.3) 0px 18px 36px -18px; 
            margin: 2%;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            transition: scale 1.5s;
        }
        .proj :hover{
            scale: 1.08;
        }
        .head{
            width: 100%;
            height: 20%;
            border-radius: 20px;
            text-align: center;
            color: white;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        .primg{
            width: 100%;
            height: 80%;
            border-radius: 20px;
            background-color: greenyellow;
        }
        .primg img{
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }
        @media (width<850px) 
        {
            .proj{
                width: 75vw;
            }
            .head{
                font-size: clamp(1.2rem,2vw,1.8rem);
                align-content: center;
                height: 30%;
            }
            .primg{
                height: 70%;
            }
        }
    </style>
</head>
<body>
    <div class="proj" onclick="loadp('https://github.com/ShivendraSinha418/XceptionNet_Deepfake_detection_model/tree/main')">
        <div class="head">Deepfake detection model</div>
        <div class="primg"><img src="https://repository-images.githubusercontent.com/298853824/81608400-b768-11eb-9573-ff3e0612f2e0" alt=""></div>
    </div>
    <div class="proj" onclick="loadp('https://github.com/ShivendraSinha418/Driver_Drowsiness_Detection/tree/main')">
        <div class="head">Drowsy Driver Classifier</div>
        <div class="primg"><img src="https://media.licdn.com/dms/image/v2/C4E12AQFLleIL-EGIIQ/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1600585924094?e=2147483647&v=beta&t=dOuF5NYPT5OgjM9mjwYS6IsEXuHRBGxlQLLeyZ7Foig" alt=""></div>
    </div>
    <script>
        function loadp(url){
            window.open(url, "_blank");
        }
    </script>
</body>
</html>
